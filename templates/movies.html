{% extends "base.html" %}

{% block content %}
<h1>Movies</h1>
<ul class="movie-list">
    {% for movie in movies %}
    <li class="movie-entry">
        <form action="{{ url_for('delete_movie', user_id=movie.user_id, movie_id=movie.id) }}" method="post">
            <button type="submit" class="btn btn-danger">Delete Movie</button>
        </form>
        <form action="{{ url_for('update_movie', user_id=movie.user_id, movie_id=movie.id) }}" method="post">
            <input name="name" class="form-control">
            <button type="submit" class="btn btn-warning">Update Movie</button>
        </form>
        {{ movie.name }}
    </li>
    {% endfor %}
</ul>
<form action="{{ url_for('add_movie', user_id=user_id) }}" method="post">
    <input name="name" class="form-control">
    <button type="submit" class="btn btn-primary">Add Movie</button>
</form>
{% endblock %}
