{% extends "base.html" %}

{% block content %}
<h1>User</h1>
<ul class="user-list">
    {% for user in users %}
    <li class="user-entry">
        <a href="{{ url_for('get_movies', user_id=user.id) }}" class="btn">{{ user.name }}</a>
    </li>
    {% endfor %}
</ul>
<form action="{{ url_for('create_user') }}" method="post">
    <input name="name">
    <button type="submit">Add User</button>
</form>
{% endblock %}
